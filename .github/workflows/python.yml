name: Python Hello World

on:
  push:
  pull_request:

jobs:
  hello-world:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-asyncio mypy detect-secrets

      - name: Run Ruff
        uses: astral-sh/ruff-action@v3

      - name: Check formatting
        uses: astral-sh/ruff-action@v3
        with:
          args: "format --check"

      - name: Run mypy
        run: mypy .

      - name: Run detect-secrets
        shell: bash
        run: |
          detect-secrets scan > secrets.json
          python -c "import json; data=json.load(open('secrets.json')); assert not data['results'], f'Secrets found: {data[\"results\"]}'"

      - name: Run tests
        run: python -m pytest

      - name: Run Hello World
        run: python main.py